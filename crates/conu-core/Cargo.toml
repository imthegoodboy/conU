[package]
name = "conu-core"
version = "0.1.14"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chacha20poly1305 = "0.10"
conu-protocol.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
native-tls = "=0.2.14"
quinn = "0.11.9"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.14.5"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
tungstenite = { version = "0.28.0", features = ["native-tls"] }
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets"] }

[target.'cfg(windows)'.dependencies]
schannel = "=0.1.27"
windows-dpapi = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[lints]
workspace = true
