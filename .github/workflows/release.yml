name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release-preflight:
    name: Release Tag Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check tagged release secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CONU_WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.CONU_WINDOWS_SIGN_CERT_PFX_BASE64 }}
          CONU_WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.CONU_WINDOWS_SIGN_CERT_PASSWORD }}
          CONU_MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.CONU_MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CONU_MACOS_DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.CONU_MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}
          CONU_MACOS_CODESIGN_IDENTITY: ${{ secrets.CONU_MACOS_CODESIGN_IDENTITY }}
          CONU_MACOS_NOTARY_APPLE_ID: ${{ secrets.CONU_MACOS_NOTARY_APPLE_ID }}
          CONU_MACOS_NOTARY_TEAM_ID: ${{ secrets.CONU_MACOS_NOTARY_TEAM_ID }}
          CONU_MACOS_NOTARY_PASSWORD: ${{ secrets.CONU_MACOS_NOTARY_PASSWORD }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          missing=""
          for name in \
            CONU_WINDOWS_SIGN_CERT_PFX_BASE64 \
            CONU_WINDOWS_SIGN_CERT_PASSWORD \
            CONU_MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 \
            CONU_MACOS_DEVELOPER_ID_APPLICATION_PASSWORD \
            CONU_MACOS_CODESIGN_IDENTITY \
            CONU_MACOS_NOTARY_APPLE_ID \
            CONU_MACOS_NOTARY_TEAM_ID \
            CONU_MACOS_NOTARY_PASSWORD \
            NPM_TOKEN; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required tagged-release secret(s):$missing"
            exit 1
          fi
          echo "Tagged release preflight passed."
      - name: Note unsigned smoke mode
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Non-tag release workflow run; signing and npm publication secrets are not required."

  packages:
    name: Package Checks
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Release version consistency
        run: python scripts/verify-release-versions.py
      - name: TypeScript SDK check
        run: npm run check --prefix sdk/typescript
      - name: npm launcher check
        run: npm run check --prefix packaging/npm/conu-cli
      - name: npm launcher pack dry run
        run: npm pack --dry-run --json
        working-directory: packaging/npm/conu-cli
      - name: TypeScript SDK pack dry run
        run: npm pack --dry-run --json
        working-directory: sdk/typescript

  production-readiness:
    name: Production Readiness Smoke
    needs: release-preflight
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Production readiness smoke gate
        shell: pwsh
        run: ./scripts/verify-production-readiness.ps1 -SmokeOnly

  build:
    name: Build ${{ matrix.name }}
    needs: [packages, production-readiness]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025-vs2026
            script: powershell -ExecutionPolicy Bypass -File scripts/build-release.ps1 -PackageSuffix windows-x64
            artifact: |
              dist/*.zip
              dist/*.zip.sha256
          - name: linux-x64
            os: ubuntu-latest
            script: PACKAGE_SUFFIX=linux-x64 sh scripts/build-release.sh
            artifact: |
              dist/*.tar.gz
              dist/*.tar.gz.sha256
          - name: linux-arm64
            os: ubuntu-24.04-arm
            script: PACKAGE_SUFFIX=linux-arm64 sh scripts/build-release.sh
            artifact: |
              dist/*.tar.gz
              dist/*.tar.gz.sha256
          - name: macos-arm64
            os: macos-15
            script: PACKAGE_SUFFIX=macos-arm64 sh scripts/build-release.sh
            artifact: |
              dist/*.zip
              dist/*.zip.sha256
          - name: macos-x64
            os: macos-15-intel
            script: PACKAGE_SUFFIX=macos-x64 sh scripts/build-release.sh
            artifact: |
              dist/*.zip
              dist/*.zip.sha256
    env:
      CONU_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure macOS signing keychain
        if: runner.os == 'macOS'
        env:
          MACOS_P12_BASE64: ${{ secrets.CONU_MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.CONU_MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.CONU_MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.CONU_MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.CONU_MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.CONU_MACOS_NOTARY_PASSWORD }}
        run: |
          set -eu
          missing=""
          for name in MACOS_P12_BASE64 MACOS_P12_PASSWORD MACOS_CODESIGN_IDENTITY MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            if [ "${CONU_SIGNING_REQUIRED:-0}" = "1" ]; then
              echo "::error::Missing macOS signing secret(s):$missing"
              exit 1
            fi
            echo "::warning::macOS signing secrets are incomplete; building an unsigned manual artifact."
            exit 0
          fi

          decode_base64() {
            if base64 --help 2>&1 | grep -q -- "--decode"; then
              base64 --decode
            else
              base64 -D
            fi
          }

          keychain_path="$RUNNER_TEMP/conu-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert_path="$RUNNER_TEMP/conu-macos-signing.p12"
          printf '%s' "$MACOS_P12_BASE64" | decode_base64 > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          xcrun notarytool store-credentials conu-notary-profile \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --keychain "$keychain_path"
          rm -f "$cert_path"
          {
            echo "CONU_MACOS_CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY"
            echo "CONU_MACOS_KEYCHAIN=$keychain_path"
            echo "CONU_MACOS_NOTARY_KEYCHAIN_PROFILE=conu-notary-profile"
          } >> "$GITHUB_ENV"
      - name: Build package
        env:
          CONU_WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.CONU_WINDOWS_SIGN_CERT_PFX_BASE64 }}
          CONU_WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.CONU_WINDOWS_SIGN_CERT_PASSWORD }}
          CONU_WINDOWS_TIMESTAMP_URL: ${{ secrets.CONU_WINDOWS_TIMESTAMP_URL }}
        run: ${{ matrix.script }}
      - name: Verify release artifact
        run: python scripts/verify-release-artifacts.py dist
      - name: Smoke release artifact install
        run: python scripts/smoke-release-artifacts.py dist
      - name: Smoke npm launcher local install
        run: python scripts/smoke-npm-launcher-local.py dist
      - name: Smoke npm launcher download install
        run: python scripts/smoke-npm-launcher-download.py dist
      - name: Attest release artifact provenance
        uses: actions/attest@v4.1.0
        with:
          subject-path: ${{ matrix.artifact }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: conu-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Verify downloaded release assets
        run: python scripts/verify-release-artifacts.py dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          cat > release-notes.md <<EOF
          conU ${TAG_NAME}

          This release includes platform archives and sibling SHA-256 checksum files.
          Archives are generated by CI and verified to exclude local conU state,
          private keys, logs, inboxes, route registries, telemetry dumps, and
          payload-bearing files.

          Windows archives contain Authenticode-signed binaries. macOS archives
          contain Developer ID-signed binaries and are submitted to Apple
          notarization. Linux archives use SHA-256 checksums plus GitHub artifact
          attestations until distro package signing is introduced.

          Installers and npm launchers must verify the matching .sha256 file.
          EOF
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --verify-tag --title "conU $TAG_NAME" --notes-file release-notes.md
          fi

  npm-publish:
    name: Publish npm Packages
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pack @conu/cli
        run: npm pack --dry-run --json
        working-directory: packaging/npm/conu-cli
      - name: Pack @conu/sdk
        run: npm pack --dry-run --json
        working-directory: sdk/typescript
      - name: Publish @conu/cli
        working-directory: packaging/npm/conu-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required for tagged @conu/cli publication."
            exit 1
          fi
          npm publish --access public --provenance
      - name: Publish @conu/sdk
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required for tagged @conu/sdk publication."
            exit 1
          fi
          npm publish --access public --provenance
